services:
  postgres:
    image: postgres:15-alpine
    container_name: nutri_ia_db
    environment:
      POSTGRES_USER: nutri_ia
      POSTGRES_PASSWORD: nutri_ia_dev
      POSTGRES_DB: nutri_ia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutri_ia -d nutri_ia_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
