# Railway configuration for Nutri IA API
# Docs: https://docs.railway.app/reference/config-as-code
#
# Setup steps (Railway UI):
# 1. Create project with two environments: staging and production
# 2. Add PostgreSQL service in each environment
# 3. Set DATABASE_URL, JWT_SECRET, JWT_REFRESH_SECRET variables
# 4. Link GitHub repo: staging → branch develop, production → branch main

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=apps/api"

[deploy]
startCommand = "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
