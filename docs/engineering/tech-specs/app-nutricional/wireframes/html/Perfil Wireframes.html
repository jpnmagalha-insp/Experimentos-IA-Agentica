<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Perfil — Wireframes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-perfil.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #root { min-height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <!-- screens.jsx defines Field/Btn primitives reused by the profile screens -->
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="screens-perfil.jsx"></script>

  <script type="text/babel">
    const { useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "sketchiness": "low",
      "accent": true,
      "font": "clean"
    }/*EDITMODE-END*/;

    const W = 410, H = 900;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      useEffect(() => {
        const body = document.body;
        body.classList.toggle("sketch-low", t.sketchiness === "low");
        body.classList.toggle("sketch-high", t.sketchiness === "high");
        body.classList.toggle("no-accent", !t.accent);
        body.classList.toggle("font-clean", t.font === "clean");
      }, [t]);

      return (
        <>
          <DesignCanvas>
            <DCSection
              id="A"
              title="A · Lista clássica"
              subtitle="Seções como listas iOS-style com linhas label/valor. Hierarquia familiar e densa. Header com botão Editar."
            >
              <DCArtboard id="PA1" label="01 · Visualização" width={W} height={H}><PA_View /></DCArtboard>
              <DCArtboard id="PA2" label="02 · Edição" width={W} height={H}><PA_Edit /></DCArtboard>
            </DCSection>

            <DCSection
              id="B"
              title="B · Cards agrupados"
              subtitle="Cada seção num card. Mais respiro entre grupos; combina com a variação C do onboarding."
            >
              <DCArtboard id="PB1" label="01 · Visualização" width={W} height={H}><PB_View /></DCArtboard>
              <DCArtboard id="PB2" label="02 · Edição" width={W} height={H}><PB_Edit /></DCArtboard>
            </DCSection>

            <DCSection
              id="C"
              title="C · Stats em destaque"
              subtitle="Dados físicos como tiles numéricos no topo — peso/altura como métricas, não rótulos. Identidade alinhada com o restante do app (Log/Relatório)."
            >
              <DCArtboard id="PC1" label="01 · Visualização" width={W} height={H}><PC_View /></DCArtboard>
              <DCArtboard id="PC2" label="02 · Edição" width={W} height={H}><PC_Edit /></DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Estilo">
              <TweakRadio
                label="Sketchiness"
                value={t.sketchiness}
                onChange={(v) => setTweak("sketchiness", v)}
                options={[
                  { label: "Limpo", value: "low" },
                  { label: "Médio", value: "medium" },
                  { label: "Solto", value: "high" },
                ]}
              />
              <TweakRadio
                label="Tipografia"
                value={t.font}
                onChange={(v) => setTweak("font", v)}
                options={[
                  { label: "À mão", value: "hand" },
                  { label: "Sans", value: "clean" },
                ]}
              />
              <TweakToggle
                label="Acento de cor"
                value={t.accent}
                onChange={(v) => setTweak("accent", v)}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
